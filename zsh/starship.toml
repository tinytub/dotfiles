# 全局配置
add_newline = false
command_timeout = 1000  # 模块超时限制 (1s)
scan_timeout = 10       # 目录扫描超时限制 (10ms)，快速跳过大目录

# ------------------------------------------------------------------------------
# Git 配置 (性能关键点)
# ------------------------------------------------------------------------------
[git_metrics]
disabled = true  # 禁用统计 (已生效)

[git_status]
ignore_submodules = true # 忽略子模块，提升大仓性能
untracked = ""           # 不显示未追踪文件符号
style = "bold yellow"

[git_commit]
commit_hash_length = 7
tag_symbol = '🔖 '
only_detached = false

[git_branch]
symbol = " "

# ------------------------------------------------------------------------------
# 上下文与文件
# ------------------------------------------------------------------------------
[package]
disabled = true # 禁用包版本显示 (减少 I/O 和噪音)

[docker_context]
symbol = " "
only_with_files = true # 仅在有 Dockerfile/compose.yml 时显示

[directory]
read_only = " 󰌾"
truncation_length = 4  # 路径过长时截断
truncation_symbol = "…/"

[memory_usage]
symbol = "󰍛 "
disabled = false
threshold = 75 # 仅在内存占用 >75% 时显示

[battery]
disabled = true # 除非你需要时刻关注电量，否则禁用以减少轮询
# [[battery.display]]
# threshold = 50

[hostname]
ssh_symbol = " "

